name: CI
on:
  push:
    branches: [main, "platform/**", "feature/**"]
  pull_request:

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate data, world dataset hashes and licenses
        run: |
          python3 tools/validate_data.py
          python3 tools/check_licenses.py

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project
        run: godot --headless --path . --import
      - name: Unit + integration tests (headless; includes real-world dataset hash, cells, partial capture, saves)
        run: godot --headless --path . -s tests/run_tests.gd
      - name: UI smoke tests on the real map
        run: godot --headless --path . -s tests/run_ui_tests.gd

  windows-build:
    name: windows x64 export
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --path . --import
      - name: Export Windows x64
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows x64" build/windows/IronDominion.exe
          cp README.md ASSET_LICENSES.md build/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: IRON-DOMINION-WINDOWS-X64
          path: build/windows/
