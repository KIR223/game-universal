name: CI
on:
  push:
    branches: [main, "platform/**", "feature/**"]
  pull_request:

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate data, world dataset hashes and licenses
        run: |
          python3 tools/validate_data.py
          python3 tools/check_licenses.py

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project
        run: godot --headless --path . --import
      - name: Unit + integration tests (headless; includes real-world dataset hash, cells, partial capture, saves)
        run: godot --headless --path . -s tests/run_tests.gd
      - name: UI smoke tests on the real map
        run: godot --headless --path . -s tests/run_ui_tests.gd
      - name: Multiplayer core (protocol, lockstep, desync repair, reconnect) on the in-memory network
        run: godot --headless --path . -s tests/run_net_tests.gd
      - name: Multiplayer through the game UI (host + client)
        run: godot --headless --path . -s tests/run_net_ui_tests.gd
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Multiplayer over real UDP (host and client processes, ENet on localhost)
        run: python tests/net_enet_test.py --days 40
