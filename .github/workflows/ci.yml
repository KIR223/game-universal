name: CI
on:
  push:
    branches: [main, "platform/**", "feature/**"]
  pull_request:

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate data, world dataset hashes and licenses
        run: |
          python3 tools/validate_data.py
          python3 tools/check_licenses.py
      - name: Secrets scan (keys, tokens, hard-coded credentials, keystores)
        run: python3 tools/check_secrets.py

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project
        run: godot --headless --path . --import
      - name: GDScript check (every script must compile)
        run: godot --headless --path . -s tools/check_gdscript.gd
      - name: Unit + integration tests (headless; includes real-world dataset hash, cells, partial capture, saves)
        run: godot --headless --path . -s tests/run_tests.gd
      - name: UI smoke tests on the real map
        run: godot --headless --path . -s tests/run_ui_tests.gd
      - name: UI audit (every button wired, layout at 9 resolutions/aspects)
        if: hashFiles('tests/run_ui_audit.gd') != ''
        run: godot --headless --path . -s tests/run_ui_audit.gd

  windows-build:
    name: windows x64 export
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --path . --import
      - name: Export Windows x64
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows x64" build/windows/IronDominion.exe
          ls -la build/windows
      - name: Smoke test - the exported EXE starts and quits (loads the PCK and the main scene)
        run: build/windows/IronDominion.exe --headless --quit-after 30
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package (README, VERSION, licenses, ZIP); refuses an EXE without the world data
        run: python tools/package_windows.py --exe build/windows/IronDominion.exe --out build/release --godot 4.7.2
      - name: Show version info
        run: cat build/release/IronDominion-*/VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: IRON-DOMINION-WINDOWS-X64
          path: build/release/IronDominion-*/
      - uses: actions/upload-artifact@v4
        with:
          name: IRON-DOMINION-WINDOWS-X64-ZIP
          path: build/release/IRON-DOMINION-WINDOWS-X64-*.zip

  android-apk:
    name: android debug APK
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0" "platforms;android-36"
      - name: Debug keystore and Godot editor settings (debug key only, no secrets)
        run: |
          keytool -genkeypair -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
      - name: Import project
        run: godot --headless --path . --import
      - name: Export debug APKs (phone arm64 + emulator x86_64)
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android debug APK" build/android/IronDominion-debug.apk
          godot --headless --path . --export-debug "Android debug APK (emulator x86_64)" build/android/IronDominion-debug-x86_64.apk
          ls -la build/android
      - name: Verify APKs are signed and contain the world data
        run: |
          for apk in build/android/*.apk; do
            "$SDK/build-tools/36.1.0/apksigner" verify "$apk"
            size=$(stat -c %s "$apk")
            echo "$apk $size bytes"
            # without data/world the APK is ~28 MB; with it ~37+ MB
            test "$size" -gt 36000000
          done
      - uses: actions/upload-artifact@v4
        with:
          name: IRON-DOMINION-ANDROID-DEBUG
          path: |
            build/android/*.apk
